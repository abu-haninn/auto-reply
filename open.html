<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فتح الصفحة</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0E11; color: #EAECEF; font-family: system-ui, Tahoma, sans-serif; text-align: center; padding: 20px; }
  .box { max-width: 340px; }
  .spin { width: 40px; height: 40px; border: 4px solid #FCD535; border-left-color: transparent; border-radius: 50%; margin: 0 auto 18px; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  a { display: inline-block; margin-top: 16px; background: #FCD535; color: #181A20; font-weight: 700; padding: 12px 22px; border-radius: 12px; text-decoration: none; }
  p { color: #8B94A3; }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <b>جاري فتح الصفحة في تطبيق فيسبوك…</b>
  <p>دوس "متابعة" في الصفحة 👍</p>
  <a id="web" href="#">افتح الصفحة</a>
</div>
<script>
  // بيفتح صفحة فيسبوك جوه التطبيق مباشرة (لو موجود) وإلا بيفتحها في المتصفح
  const id = (new URLSearchParams(location.search).get('id') || '').replace(/[^0-9]/g, '');
  const web = 'https://www.facebook.com/' + id;
  document.getElementById('web').href = web;
  const ua = navigator.userAgent;
  if (!id) location.replace('https://www.facebook.com/');
  else if (/android/i.test(ua)) {
    location.href = 'intent://page/' + id + '#Intent;scheme=fb;package=com.facebook.katana;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
  } else if (/iphone|ipad|ipod/i.test(ua)) {
    location.href = 'fb://profile/' + id;
    setTimeout(() => location.replace(web), 1500);
  } else {
    location.replace(web);
  }
</script>
</body>
</html>
